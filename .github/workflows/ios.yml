name: iOS

# PomDaisy: the iOS build. Builds the Android app's own Kotlin / Compose UI for iOS (ios/compose), the cores (mGBA + companion, ios/core; DSperate + the DS companion, ios/ds; melonDS
# + EXPAND, ios/melonds; all without JIT) for iPhone / iPad, generates the Xcode project
# (ios/App/project.yml, XcodeGen) and archives the app. With the App Store Connect secrets set (ASC_KEY_ID,
# ASC_ISSUER_ID, ASC_KEY_P8, APPLE_TEAM_ID) the archive is signed and uploaded to TestFlight; without them it's an
# unsigned compile check.
on:
  push:
    branches: [ios]
    # Docs and the TestFlight feedback fetch (ios-feedback.yml) alone don't rebuild the app.
    paths-ignore: ['**.md', ios/feedback-request, ios/testflight_feedback.py, ios/feedback_pub.pem, .github/workflows/ios-feedback.yml]
  pull_request:
    branches: [ios]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: macos-15
    env:
      HAS_ASC: ${{ secrets.ASC_KEY_ID != '' && secrets.ASC_ISSUER_ID != '' && secrets.ASC_KEY_P8 != '' && secrets.APPLE_TEAM_ID != '' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Which App Store Connect secrets are set (names only, never values)
        env:
          S1: ${{ secrets.ASC_KEY_ID != '' }}
          S2: ${{ secrets.ASC_ISSUER_ID != '' }}
          S3: ${{ secrets.ASC_KEY_P8 != '' }}
          S4: ${{ secrets.APPLE_TEAM_ID != '' }}
          V1: ${{ vars.ASC_KEY_ID != '' }}
          V2: ${{ vars.ASC_ISSUER_ID != '' }}
          V3: ${{ vars.ASC_KEY_P8 != '' }}
          V4: ${{ vars.APPLE_TEAM_ID != '' }}
        run: |
          echo "secret ASC_KEY_ID=$S1 ASC_ISSUER_ID=$S2 ASC_KEY_P8=$S3 APPLE_TEAM_ID=$S4"
          echo "variable ASC_KEY_ID=$V1 ASC_ISSUER_ID=$V2 ASC_KEY_P8=$V3 APPLE_TEAM_ID=$V4"
      - name: Core submodules (mGBA, DSperate, melonDS)
        run: |
          git submodule update --init --depth 1 third_party/mgba third_party/melonds third_party/dsperate third_party/rcheevos
          git submodule update --init --recursive --depth 1 third_party/dsperate-lr
      - name: Tools
        run: |
          # App Store Connect takes only apps built with the iOS 26 SDK (Xcode 26) or later: pick the newest Xcode.
          X=$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$X" ]; then sudo xcode-select -s "$X/Contents/Developer"; fi
          ls -d /Applications/Xcode*.app
          xcodebuild -version
          brew list ninja >/dev/null 2>&1 || brew install ninja
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
      - name: Core for iPhone / iPad (arm64)
        run: |
          cmake -S ios/core -B build/ios -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=16.0 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          cmake --build build/ios --target pomdaisy_core pomdaisy_link_check
          ls -la build/ios/libpomdaisy_core.a
      - name: melonDS core for iPhone / iPad (arm64, no JIT)
        run: |
          cmake -S ios/melonds -B build/ios-md -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=16.0 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          cmake --build build/ios-md --target pomdaisy_md
          ls -la build/ios-md/pomdaisy_md.o
          if nm -gU build/ios-md/pomdaisy_md.o | awk '{print $NF}' | grep -v '^_pdmd_'; then
            echo "::error::pomdaisy_md.o exports more than its pdmd_* entry points"; exit 1
          fi
      - name: Nintendo DS core for iPhone / iPad (arm64, no JIT)
        run: |
          cmake -S ios/ds -B build/ios-ds -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=16.0 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DPython3_EXECUTABLE="$(command -v python3)" \
            -DPD_GB_CORE="$PWD/build/ios/libpomdaisy_core.a" \
            -DPD_MD_CORE="$PWD/build/ios-md/pomdaisy_md.o"
          # The prelinked core, then the app's bridge linked with all three cores (a symbol clash shows here).
          cmake --build build/ios-ds --target pomdaisy_ds pomdaisy_ds_check
          ls -la build/ios-ds/pomdaisy_ds.o
          # Only the core's entry points may be visible, or its symbols meet the Game Boy core's in the app.
          if nm -gU build/ios-ds/pomdaisy_ds.o | awk '{print $NF}' | grep -v '^_pdds_'; then
            echo "::error::pomdaisy_ds.o exports more than its pdds_* entry points"; exit 1
          fi
      # Kotlin/Native's toolchain and Gradle's caches: the first build of the Compose framework downloads and compiles a lot.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.konan
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: kmp-${{ runner.os }}-${{ hashFiles('ios/compose/build.gradle.kts', 'ios/compose/appui/build.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: kmp-${{ runner.os }}-
      - name: The Android app's native library for iOS (its JNI glue over ios/native's JNI)
        run: |
          cmake -S ios/native -B build/ios-native -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=16.0 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          cmake --build build/ios-native --target pomdaisy_android
          ls -la build/ios-native/pomdaisy_android.o
          if nm -gU build/ios-native/pomdaisy_android.o | awk '{print $NF}' | grep -vE '^_(Java_|pd_jni_)'; then
            echo "::error::pomdaisy_android.o exports more than the glue's entry points"; exit 1
          fi
      - name: The Android app's UI for iOS (Compose Multiplatform framework)
        run: |
          export JAVA_HOME="${JAVA_HOME_21_arm64:-${JAVA_HOME_17_arm64:-$JAVA_HOME}}"
          java -version
          ./gradlew -p ios/compose --no-daemon linkReleaseFrameworkIosArm64
          ls -la ios/compose/build/bin/iosArm64/releaseFramework/
      - name: Xcode project
        working-directory: ios/App
        run: xcodegen generate
      - name: Archive (unsigned compile check)
        if: env.HAS_ASC != 'true'
        working-directory: ios/App
        run: |
          set -o pipefail
          xcodebuild -project PomDaisy.xcodeproj -scheme PomDaisy -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/PomDaisy.xcarchive" archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO 2>&1 | grep -E "error|warning: .*\.swift|ARCHIVE|BUILD" | tail -n 150
      - name: App Store Connect key
        if: env.HAS_ASC == 'true'
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          # The secret may hold the .p8 file as it is, without its BEGIN / END lines, on one line, with Windows line
          # ends, or base64 encoded as a whole: all become the PEM file xcodebuild wants. Only shapes are logged.
          key="$RUNNER_TEMP/AuthKey.p8"
          raw=$(printf '%s' "$ASC_KEY_P8" | tr -d '\r')
          if ! printf '%s' "$raw" | grep -q "BEGIN PRIVATE KEY"; then
            decoded=$(printf '%s' "$raw" | tr -d ' \n' | base64 -D 2>/dev/null || true)
            if printf '%s' "$decoded" | grep -q "BEGIN PRIVATE KEY"; then raw="$decoded"; fi
          fi
          body=$(printf '%s' "$raw" | sed -e 's/-----BEGIN PRIVATE KEY-----//' -e 's/-----END PRIVATE KEY-----//' | tr -d ' \n\t')
          { echo "-----BEGIN PRIVATE KEY-----"; printf '%s' "$body" | fold -w 64; echo; echo "-----END PRIVATE KEY-----"; } > "$key"
          chmod 600 "$key"
          echo "key secret: $(printf '%s' "$ASC_KEY_P8" | wc -c | tr -d ' ') chars, header in secret: $(printf '%s' "$ASC_KEY_P8" | grep -c 'BEGIN PRIVATE KEY'), body: ${#body} chars"
          if openssl pkey -in "$key" -noout 2>/dev/null; then echo "key: a valid private key"; else echo "::error::ASC_KEY_P8 is not the contents of an App Store Connect .p8 key"; exit 1; fi
      - name: Archive (for TestFlight)
        if: env.HAS_ASC == 'true'
        working-directory: ios/App
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Archived unsigned; the export below signs it for distribution (a cloud-managed certificate). Signing the
          # archive itself made Xcode create a new development certificate on every run (the runner is new each
          # time), until the account had its maximum and the build stopped with "Choose a certificate to revoke".
          set -o pipefail
          xcodebuild -project PomDaisy.xcodeproj -scheme PomDaisy -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/PomDaisy.xcarchive" archive \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" 2>&1 | grep -E "error|warning: .*\.swift|ARCHIVE|BUILD|Signing|provisioning" | tail -n 150
      - name: Upload to TestFlight
        if: env.HAS_ASC == 'true' && github.event_name != 'pull_request'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/PomDaisy.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" 2>&1 | tail -n 60
      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"

  # The app on an iPhone simulator: built for it, started on the Android app's Library and then on two test games
  # (linux/make_diagnostic.py's own Game Boy / GBA programs, no game code), with screenshots, its console and any crash
  # report uploaded as the run's "simulator" artifact. Nothing here is signed or uploaded to TestFlight.
  simulator:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Core submodules (mGBA, DSperate, melonDS)
        run: |
          git submodule update --init --depth 1 third_party/mgba third_party/melonds third_party/dsperate third_party/rcheevos
          git submodule update --init --recursive --depth 1 third_party/dsperate-lr
      - name: Tools
        run: |
          X=$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$X" ]; then sudo xcode-select -s "$X/Contents/Developer"; fi
          xcodebuild -version
          brew list ninja >/dev/null 2>&1 || brew install ninja
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
      - name: Cores and the native library for the simulator
        run: |
          SIM="-G Ninja -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=iphonesimulator -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=16.0 -DCMAKE_BUILD_TYPE=Release -DCMAKE_POLICY_VERSION_MINIMUM=3.5"
          cmake -S ios/core -B build/ios $SIM
          cmake --build build/ios --target pomdaisy_core
          cmake -S ios/melonds -B build/ios-md $SIM
          cmake --build build/ios-md --target pomdaisy_md
          cmake -S ios/ds -B build/ios-ds $SIM -DPython3_EXECUTABLE="$(command -v python3)" \
            -DPD_GB_CORE="$PWD/build/ios/libpomdaisy_core.a" -DPD_MD_CORE="$PWD/build/ios-md/pomdaisy_md.o"
          cmake --build build/ios-ds --target pomdaisy_ds
          cmake -S ios/native -B build/ios-native $SIM
          cmake --build build/ios-native --target pomdaisy_android
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.konan
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: kmp-sim-${{ runner.os }}-${{ hashFiles('ios/compose/build.gradle.kts', 'ios/compose/appui/build.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            kmp-sim-${{ runner.os }}-
            kmp-${{ runner.os }}-
      - name: The Android app's UI for the simulator (debug framework)
        run: |
          export JAVA_HOME="${JAVA_HOME_21_arm64:-${JAVA_HOME_17_arm64:-$JAVA_HOME}}"
          ./gradlew -p ios/compose --no-daemon linkDebugFrameworkIosSimulatorArm64
      - name: Build the app for the simulator
        working-directory: ios/App
        run: |
          sed -i '' 's#iosArm64/releaseFramework#iosSimulatorArm64/debugFramework#g' project.yml
          xcodegen generate
          set -o pipefail
          xcodebuild -project PomDaisy.xcodeproj -scheme PomDaisy -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            -derivedDataPath "$RUNNER_TEMP/dd" CODE_SIGNING_ALLOWED=NO build 2>&1 | grep -E "error|BUILD" | tail -n 100
      - name: Run it on a simulator
        run: |
          OUT="$RUNNER_TEMP/simulator"; mkdir -p "$OUT"
          APP="$RUNNER_TEMP/dd/Build/Products/Debug-iphonesimulator/PomDaisy.app"
          ID=com.nowarmoreweed.pomdaisy
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          d=json.load(sys.stdin)["devices"]
          c=[x for r,v in d.items() if "iOS" in r for x in v if x["name"].startswith("iPhone")]
          c.sort(key=lambda x:("Pro Max" not in x["name"], x["name"]))
          print(c[0]["udid"])')
          echo "simulator $UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"
          DATA=$(xcrun simctl get_app_container "$UDID" $ID data)
          mkdir -p "$DATA/Documents/roms"
          (cd "$DATA/Documents/roms" && python3 "$GITHUB_WORKSPACE/linux/make_diagnostic.py")
          ls -la "$DATA/Documents/roms"
          run() { # name, seconds, extra env
            name=$1; secs=$2; shift 2
            env SIMCTL_CHILD_PD_ANDROID=1 "$@" xcrun simctl launch --console-pty --terminate-running-process "$UDID" $ID > "$OUT/$name.log" 2>&1 &
            for t in $(seq 5 5 "$secs"); do
              sleep 5
              xcrun simctl io "$UDID" screenshot "$OUT/$name-${t}s.png" >/dev/null 2>&1 || true
            done
            if xcrun simctl spawn "$UDID" launchctl list | grep -q "$ID"; then echo "$name: still running"; else echo "::warning::$name: the app is gone (crash?)"; fi
            xcrun simctl terminate "$UDID" $ID 2>/dev/null || true
            sleep 2
          }
          run library 25
          run gba 30 SIMCTL_CHILD_PD_TEST_ROM="$DATA/Documents/roms/diagnostic.gba"
          run gb 30 SIMCTL_CHILD_PD_TEST_ROM="$DATA/Documents/roms/diagnostic.gb"
          cp ~/Library/Logs/DiagnosticReports/PomDaisy* "$OUT/" 2>/dev/null || true
          ls -la "$OUT"
          for f in "$OUT"/*.log; do echo "== $f"; tail -n 40 "$f"; done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: simulator
          path: ${{ runner.temp }}/simulator
          if-no-files-found: ignore
