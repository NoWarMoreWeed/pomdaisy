# PomDaisy's Xcode project, generated by XcodeGen (`xcodegen generate` in this folder; CI does it). The core
# (libpomdaisy_core.a) is built first by CMake from ../core into ../../build/ios.
name: PomDaisy
options:
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  PomDaisy:
    type: application
    platform: iOS
    dependencies:
      - framework: ../compose/build/bin/iosArm64/releaseFramework/PomDaisyCompose.framework
        embed: false
        link: true
    sources:
      - path: Sources
      - path: Assets.xcassets
      # The Android app's assets (fonts, shaders): its Kotlin code reads them from the bundle's "assets" folder.
      - path: ../../app/src/main/assets
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nowarmoreweed.pomdaisy
        PRODUCT_NAME: PomDaisy
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Bridge/PomDaisy-Bridging-Header.h
        HEADER_SEARCH_PATHS: "$(SRCROOT)/../../third_party/mgba/src/platform/libretro"
        LIBRARY_SEARCH_PATHS: "$(SRCROOT)/../../build/ios"
        # The Game Boy core (ios/core) and the two Nintendo DS cores (ios/ds: DSperate, ios/melonds: melonDS; each one
        # prelinked object, C++ inside; melonDS needs zlib).
        OTHER_LDFLAGS: "-lpomdaisy_core $(SRCROOT)/../../build/ios-ds/pomdaisy_ds.o $(SRCROOT)/../../build/ios-md/pomdaisy_md.o $(SRCROOT)/../../build/ios-native/pomdaisy_android.o -lc++ -lz -lsqlite3"
        # The Android app's own UI (ios/compose, Compose Multiplatform): a static framework.
        FRAMEWORK_SEARCH_PATHS: "$(SRCROOT)/../compose/build/bin/iosArm64/releaseFramework"
        GCC_C_LANGUAGE_STANDARD: gnu11
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        SUPPORTS_MACCATALYST: NO
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: PomDaisy
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen:
          UIColorName: ""
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIStatusBarHidden: true
        # Compose Multiplatform draws at the screen's full refresh rate (ProMotion) only with this.
        CADisableMinimumFrameDurationOnPhone: true
        # The Documents folder shows in the Files app ("On My iPhone > PomDaisy"): ROMs can go straight into roms/.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: false
        ITSAppUsesNonExemptEncryption: false
        GCSupportsControllerUserInteraction: true
        GCSupportedGameControllers:
          - ProfileName: ExtendedGamepad
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.nowarmoreweed.pomdaisy.gba
            UTTypeDescription: Game Boy Advance ROM
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [gba]
          - UTTypeIdentifier: com.nowarmoreweed.pomdaisy.gbc
            UTTypeDescription: Game Boy Color ROM
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [gbc]
          - UTTypeIdentifier: com.nowarmoreweed.pomdaisy.gb
            UTTypeDescription: Game Boy ROM
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [gb]
          - UTTypeIdentifier: com.nowarmoreweed.pomdaisy.nds
            UTTypeDescription: Nintendo DS ROM
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [nds]
        CFBundleDocumentTypes:
          - CFBundleTypeName: Game Boy ROM
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes:
              - com.nowarmoreweed.pomdaisy.gba
              - com.nowarmoreweed.pomdaisy.gbc
              - com.nowarmoreweed.pomdaisy.gb
              - com.nowarmoreweed.pomdaisy.nds
